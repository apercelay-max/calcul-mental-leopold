<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcul mental — Léopold</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- Écran d'accueil -->
  <section id="screen-home" class="screen">
    <header class="app-header">
      <h1>🧮 Calcul mental</h1>
      <p class="subtitle">L'entraînement de Léopold</p>
    </header>

    <div class="card level-card">
      <div class="level-badge" id="home-level-number">1</div>
      <div class="level-info">
        <h2 id="home-level-name">Chargement…</h2>
        <p id="home-level-desc"></p>
      </div>
    </div>

    <div class="card progress-card" id="progress-card">
      <p id="progress-text">—</p>
      <div class="dots" id="progress-dots"></div>
    </div>

    <button id="btn-start" class="btn-primary">Démarrer une série ▶</button>

    <div class="card stats-card">
      <div class="stat">
        <span class="stat-value" id="stat-best">—</span>
        <span class="stat-label">Meilleur score</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-count">0</span>
        <span class="stat-label">Séries jouées</span>
      </div>
    </div>

    <div class="levels-map" id="levels-map"></div>
  </section>

  <!-- Écran de quiz -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-topbar">
      <span id="quiz-progress">Question 1/10</span>
      <span id="quiz-timer">0:00</span>
      <span id="quiz-score">Score 0</span>
    </div>

    <div class="quiz-question-zone">
      <p id="quiz-question" class="quiz-question">?</p>
      <button id="btn-hint" type="button" class="btn-hint">💡 Voir un indice</button>
      <p id="quiz-hint" class="quiz-hint hidden"></p>
      <div class="quiz-answer-row">
        <button id="btn-sign" class="btn-sign hidden">±</button>
        <input type="text" id="quiz-input" class="quiz-input" inputmode="decimal" autocomplete="off" placeholder="ta réponse">
      </div>
      <p id="quiz-feedback" class="quiz-feedback"></p>
      <button id="btn-validate" class="btn-primary">Valider</button>
      <button id="btn-next" class="btn-primary hidden">Suivant ▶</button>
    </div>
  </section>

  <!-- Écran de résultats -->
  <section id="screen-results" class="screen hidden">
    <h2>Résultats</h2>
    <div class="card results-card">
      <p class="results-score" id="results-score">0/10</p>
      <p id="results-time"></p>
      <p id="results-message" class="results-message"></p>
      <p id="results-levelup" class="results-levelup hidden"></p>
    </div>
    <button id="btn-replay" class="btn-primary">Rejouer ce niveau ▶</button>
    <button id="btn-home" class="btn-secondary">Retour à l'accueil</button>
  </section>

</div>

<script src="js/curriculum.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
